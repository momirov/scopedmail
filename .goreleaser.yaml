version: 2

project_name: scopedmail

before:
  hooks:
    - go mod tidy

builds:
  - id: scopedmail
    main: ./cmd/scopedmail
    binary: scopedmail
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w"]

archives:
  - formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github-native
